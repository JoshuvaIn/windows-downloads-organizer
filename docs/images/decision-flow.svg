<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="470" viewBox="0 0 1240 470" role="img" aria-label="What happens to each loose file">
<rect width="1240" height="470" rx="12" fill="#f3f6fb" stroke="#c8d3e3"/>
<text x="24" y="38" font-family="Segoe UI Variable Text, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#0b3d6e">What happens to each loose file</text>
<rect x="24" y="64" width="200" height="132" rx="10" fill="#cfe4fa" stroke="#0067c0" stroke-width="1.5"/><text x="124" y="125" text-anchor="middle" font-family="Segoe UI Variable Text, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#1a1a1a">A loose file</text><text x="124" y="146" text-anchor="middle" font-family="Segoe UI Variable Text, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#1a1a1a">in the folder</text>
<rect x="279" y="64" width="200" height="132" rx="10" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.5"/><text x="379" y="104" text-anchor="middle" font-family="Segoe UI Variable Text, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#1a1a1a">Hidden, system,</text><text x="379" y="125" text-anchor="middle" font-family="Segoe UI Variable Text, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#1a1a1a">unfinished download,</text><text x="379" y="146" text-anchor="middle" font-family="Segoe UI Variable Text, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#1a1a1a">or changed in the</text><text x="379" y="167" text-anchor="middle" font-family="Segoe UI Variable Text, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#1a1a1a">last 2 minutes?</text>
<rect x="534" y="64" width="200" height="132" rx="10" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.5"/><text x="634" y="114.5" text-anchor="middle" font-family="Segoe UI Variable Text, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#1a1a1a">Identical copy</text><text x="634" y="135.5" text-anchor="middle" font-family="Segoe UI Variable Text, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#1a1a1a">already sorted</text><text x="634" y="156.5" text-anchor="middle" font-family="Segoe UI Variable Text, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#1a1a1a">(or already in _copy)?</text>
<rect x="789" y="64" width="200" height="132" rx="10" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.5"/><text x="889" y="114.5" text-anchor="middle" font-family="Segoe UI Variable Text, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#1a1a1a">Different file with</text><text x="889" y="135.5" text-anchor="middle" font-family="Segoe UI Variable Text, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#1a1a1a">the same name</text><text x="889" y="156.5" text-anchor="middle" font-family="Segoe UI Variable Text, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#1a1a1a">already there?</text>
<rect x="1044" y="64" width="200" height="132" rx="10" fill="#dff6dd" stroke="#0f7b0f" stroke-width="1.5"/><text x="1144" y="93.5" text-anchor="middle" font-family="Segoe UI Variable Text, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#1a1a1a">Move it to its</text><text x="1144" y="114.5" text-anchor="middle" font-family="Segoe UI Variable Text, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#1a1a1a">type folder.</text><text x="1144" y="135.5" text-anchor="middle" font-family="Segoe UI Variable Text, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#1a1a1a">PDF, Word, PowerPoint</text><text x="1144" y="156.5" text-anchor="middle" font-family="Segoe UI Variable Text, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#1a1a1a">and Markdown get</text><text x="1144" y="177.5" text-anchor="middle" font-family="Segoe UI Variable Text, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#1a1a1a">a date prefix.</text>
<path d="M224 130 H279" stroke="#4a4a4a" stroke-width="2.2" fill="none"/><path d="M270 124 L279 130 L270 136" stroke="#4a4a4a" stroke-width="2.2" fill="none"/>
<path d="M479 130 H534" stroke="#4a4a4a" stroke-width="2.2" fill="none"/><path d="M525 124 L534 130 L525 136" stroke="#4a4a4a" stroke-width="2.2" fill="none"/>
<path d="M734 130 H789" stroke="#4a4a4a" stroke-width="2.2" fill="none"/><path d="M780 124 L789 130 L780 136" stroke="#4a4a4a" stroke-width="2.2" fill="none"/>
<path d="M989 130 H1044" stroke="#4a4a4a" stroke-width="2.2" fill="none"/><path d="M1035 124 L1044 130 L1035 136" stroke="#4a4a4a" stroke-width="2.2" fill="none"/>
<text x="506.5" y="120" text-anchor="middle" font-family="Segoe UI Variable Text, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#6b6b6b">No</text>
<text x="761.5" y="120" text-anchor="middle" font-family="Segoe UI Variable Text, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#6b6b6b">No</text>
<text x="1016.5" y="120" text-anchor="middle" font-family="Segoe UI Variable Text, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#6b6b6b">No</text>
<path d="M379 196 V266" stroke="#4a4a4a" stroke-width="2.2" fill="none"/><path d="M373 257 L379 266 L385 257" stroke="#4a4a4a" stroke-width="2.2" fill="none"/>
<text x="389" y="234" text-anchor="start" font-family="Segoe UI Variable Text, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#6b6b6b">Yes</text>
<path d="M634 196 V266" stroke="#4a4a4a" stroke-width="2.2" fill="none"/><path d="M628 257 L634 266 L640 257" stroke="#4a4a4a" stroke-width="2.2" fill="none"/>
<text x="644" y="234" text-anchor="start" font-family="Segoe UI Variable Text, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#6b6b6b">Yes</text>
<path d="M889 196 V266" stroke="#4a4a4a" stroke-width="2.2" fill="none"/><path d="M883 257 L889 266 L895 257" stroke="#4a4a4a" stroke-width="2.2" fill="none"/>
<text x="899" y="234" text-anchor="start" font-family="Segoe UI Variable Text, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#6b6b6b">Yes</text>
<rect x="279" y="266" width="200" height="104" rx="10" fill="#fff4ce" stroke="#9d5d00" stroke-width="1.5"/><text x="379" y="323.5" text-anchor="middle" font-family="Segoe UI Variable Text, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#1a1a1a">Leave it alone</text>
<rect x="534" y="266" width="200" height="104" rx="10" fill="#dff6dd" stroke="#0f7b0f" stroke-width="1.5"/><text x="634" y="302.5" text-anchor="middle" font-family="Segoe UI Variable Text, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#1a1a1a">Move it into _copy</text><text x="634" y="323.5" text-anchor="middle" font-family="Segoe UI Variable Text, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#1a1a1a">(nothing is</text><text x="634" y="344.5" text-anchor="middle" font-family="Segoe UI Variable Text, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#1a1a1a">ever deleted)</text>
<rect x="789" y="266" width="200" height="104" rx="10" fill="#fff4ce" stroke="#9d5d00" stroke-width="1.5"/><text x="889" y="292" text-anchor="middle" font-family="Segoe UI Variable Text, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#1a1a1a">Try once with a date</text><text x="889" y="313" text-anchor="middle" font-family="Segoe UI Variable Text, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#1a1a1a">prefix. Still taken?</text><text x="889" y="334" text-anchor="middle" font-family="Segoe UI Variable Text, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#1a1a1a">Leave it in place</text><text x="889" y="355" text-anchor="middle" font-family="Segoe UI Variable Text, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#1a1a1a">and say so.</text>
<path d="M1144 196 V266" stroke="#4a4a4a" stroke-width="2.2" fill="none"/><path d="M1138 257 L1144 266 L1150 257" stroke="#4a4a4a" stroke-width="2.2" fill="none"/>
<rect x="1044" y="266" width="200" height="104" rx="10" fill="#cfe4fa" stroke="#0067c0" stroke-width="1.5"/><text x="1144" y="313" text-anchor="middle" font-family="Segoe UI Variable Text, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#1a1a1a">Write one log line.</text><text x="1144" y="334" text-anchor="middle" font-family="Segoe UI Variable Text, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#1a1a1a">Undo can reverse it.</text>
<text x="24" y="418" font-family="Segoe UI Variable Text, Segoe UI, Arial, sans-serif" font-size="16" fill="#4a4a4a">Just before every move, the tool checks again that nothing is in the way. Nothing is ever overwritten or deleted.</text>
</svg>
